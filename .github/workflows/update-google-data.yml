name: Update Google restaurant data

on:
  schedule:
    # Every Sunday at 07:00 UTC.
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Google ratings
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/update-google-data.mjs

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add reviews-data.js
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'chore: update Google restaurant ratings'
          git push
